version: '3.8'
services:
  webhook:
    build: 
      context: .
      dockerfile: Dockerfile
    command: uvicorn webhook_server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./inflows.db:/app/inflows.db
    restart: always
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./inflows.db:/app/inflows.db
    depends_on:
      - webhook
    restart: always
